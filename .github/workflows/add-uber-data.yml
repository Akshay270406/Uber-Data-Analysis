name: Add Uber 2014 monthly data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-uber-data.yml"

permissions:
  contents: write

jobs:
  add-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download and validate monthly CSVs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw
          base="https://raw.githubusercontent.com/fivethirtyeight/uber-tlc-foil-response/63bb878b76f47f69b4527d50af57aac26dead983/uber-trip-data"
          for month in may jun jul aug sep; do
            file="uber-raw-data-${month}14.csv"
            curl -fL --retry 5 --retry-delay 2 "${base}/${file}" -o "data/raw/${file}"
            test -s "data/raw/${file}"
            python -c 'import csv,sys; assert next(csv.reader(open(sys.argv[1], newline=""))) == ["Date/Time","Lat","Lon","Base"]' "data/raw/${file}"
            echo "${file}: $(wc -l < "data/raw/${file}") lines"
          done
      - name: Commit the datasets and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.csv
          rm .github/workflows/add-uber-data.yml
          git add -u .github/workflows/add-uber-data.yml
          git commit -m "Add May–September 2014 Uber pickup data"
          git push
